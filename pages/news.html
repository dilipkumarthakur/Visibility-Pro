<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News & Insights | Visibility Pro</title>
<link rel="stylesheet" href="../style.css">
<style>
.news-page{background:#080808;color:#F2F2F2;min-height:100vh;padding:120px 0 90px}.news-page-container{width:min(1180px,calc(100% - 80px));margin:auto}.news-page-hero{position:relative;padding:30px 0 46px;overflow:hidden}.news-page-hero:after{content:"";position:absolute;width:520px;height:520px;right:-190px;top:-180px;border:1px solid rgba(201,151,62,.28);border-radius:50%}.news-page-label{display:flex;align-items:center;gap:22px;color:#C9973E;font-size:11px;letter-spacing:.28em;text-transform:uppercase}.news-page-label i{width:95px;height:1px;background:#C9973E}.news-page-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-top:18px}.news-page-title{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,6vw,78px);font-weight:400;line-height:.98;letter-spacing:-.04em}.news-page-title span{color:#C9973E}.news-page-intro{max-width:420px;color:#858585;font-size:15px;line-height:1.7;margin:0 0 5px}.news-page-tools{display:flex;align-items:center;justify-content:space-between;gap:25px;margin-bottom:38px;padding-bottom:24px;border-bottom:1px solid #292929}.news-filters{display:flex;flex-wrap:wrap;gap:9px}.news-filter{border:1px solid #444;background:transparent;color:#C8C8C8;padding:12px 20px;border-radius:999px;cursor:pointer;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.news-filter:hover,.news-filter.active{border-color:#C9973E;background:#C9973E;color:#080808}.news-search{width:310px;flex:0 0 310px;position:relative}.news-search input{width:100%;box-sizing:border-box;border:1px solid #444;background:#111;color:#F2F2F2;padding:14px 18px 14px 44px;outline:0;font-size:13px}.news-search input:focus{border-color:#C9973E}.news-search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#C9973E;font-size:16px}.news-page-status{min-height:20px;margin-bottom:18px;color:#858585;font-size:12px}.all-news-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.all-news-card{min-width:0;border:1px solid #292929;background:#111;display:flex;flex-direction:column;overflow:hidden;transition:.25s}.all-news-card:hover{transform:translateY(-4px);border-color:#7d602f}.all-news-image{display:block;height:190px;background:#181818;overflow:hidden}.all-news-image img{width:100%;height:100%;display:block;object-fit:cover;transition:.4s}.all-news-card:hover .all-news-image img{transform:scale(1.04)}.all-news-body{display:flex;flex-direction:column;flex:1;padding:22px 20px 19px}.all-news-category{color:#C9973E;font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:13px}.all-news-title{margin:0;color:#F2F2F2;font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:400;line-height:1.2}.all-news-summary{margin:13px 0 0;color:#858585;font-size:12px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.all-news-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:22px}.all-news-date{color:#858585;font-size:9px;letter-spacing:.1em;text-transform:uppercase}.all-news-view{display:inline-flex;align-items:center;gap:9px;color:#C9973E;text-decoration:none;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.all-news-view span{font-size:16px}.news-empty,.news-loading-page{grid-column:1/-1;padding:80px 20px;text-align:center;color:#858585;border:1px solid #292929}.news-pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:45px}.news-page-btn{min-width:40px;height:40px;border:1px solid #444;background:transparent;color:#C8C8C8;cursor:pointer;font-size:12px}.news-page-btn:hover,.news-page-btn.active{border-color:#C9973E;background:#C9973E;color:#080808}@media(max-width:1050px){.all-news-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.news-page-container{width:min(calc(100% - 40px),680px)}.news-page-title-row{display:block}.news-page-intro{margin-top:20px}.news-page-tools{display:block}.news-search{width:100%;margin-top:18px}.all-news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.news-page{padding:95px 0 60px}.news-page-container{width:calc(100% - 32px)}.news-page-title{font-size:46px}.news-filter{padding:10px 14px;font-size:9px}.all-news-grid{grid-template-columns:1fr}.all-news-image{height:210px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a href="../index.html" class="brand"><img src="../images/visibilitypro-logo.png" alt="Visibility Pro" class="brand-logo"></a><nav class="main-nav"><a href="../index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a href="clients.html">Clients</a><a href="case-studies.html">Case Studies</a></nav><a href="contact.html" class="contact-btn">GET IN TOUCH <span>→</span></a><button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button></div><div class="mobile-nav"><a href="../index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a href="clients.html">Clients</a><a href="case-studies.html">Case Studies</a><a href="contact.html">Get in Touch</a></div></header>
<main class="news-page"><div class="news-page-container"><section class="news-page-hero"><div class="news-page-label"><span>NEWS / INSIGHTS</span><i></i></div><div class="news-page-title-row"><h1 class="news-page-title">Latest News &amp; <span>Insights.</span></h1><p class="news-page-intro">Updates from PR, digital, reputation and the wider industry — selected for the conversations that matter.</p></div></section><section><div class="news-page-tools"><div class="news-filters"><button class="news-filter active" data-category="ALL">All News</button><button class="news-filter" data-category="PR & MEDIA">PR &amp; Media</button><button class="news-filter" data-category="DIGITAL">Digital</button><button class="news-filter" data-category="REPUTATION">Reputation</button><button class="news-filter" data-category="INDUSTRY">Industry</button></div><div class="news-search"><span class="news-search-icon">⌕</span><input type="search" id="newsSearch" placeholder="Search news, topics or keywords..." autocomplete="off"></div></div><div class="news-page-status" id="newsPageStatus"></div><div class="all-news-grid" id="allNewsGrid"><div class="news-loading-page">Loading latest news...</div></div><div class="news-pagination" id="newsPagination"></div></section></div></main>
<script src="../script.js"></script>
<script>const NEWS_PAGE_API="https://script.google.com/macros/s/AKfycbx2uOnY56-E7eB5eOhxIzSAX8cJuRQ78YR3Rbglc77HoUgBTenc42tA7UEQlpQ9b3Q/exec";const grid=document.getElementById("allNewsGrid"),pagination=document.getElementById("newsPagination"),status=document.getElementById("newsPageStatus"),search=document.getElementById("newsSearch"),filters=document.querySelectorAll(".news-filter");let items=[],category="ALL",page=1;const perPage=8;function esc(v){const d=document.createElement("div");d.textContent=v||"";return d.innerHTML}function img(v){return v&&v.startsWith("images/")?"../"+v:(v||"../images/news-01.jpg")}function card(n){const title=esc(n.title||"Latest News"),cat=esc(n.category||"NEWS"),date=esc(n.date||""),summary=esc(n.summary||""),link=n.link||"#";return `<article class="all-news-card"><a class="all-news-image" href="${link}" target="_blank" rel="noopener noreferrer"><img src="${img(n.image)}" alt="${title}" loading="lazy" onerror="this.src='../images/news-01.jpg'"></a><div class="all-news-body"><div class="all-news-category">${cat}</div><h2 class="all-news-title">${title}</h2>${summary?`<p class="all-news-summary">${summary}</p>`:""}<div class="all-news-bottom"><div class="all-news-date">${date}</div><a class="all-news-view" href="${link}" target="_blank" rel="noopener noreferrer">VIEW <span>→</span></a></div></div></article>`}function filtered(){const q=(search.value||"").trim().toLowerCase();return items.filter(n=>(category==="ALL"||String(n.category||"").toUpperCase()===category)&&(!q||[n.title,n.category,n.summary].join(" ").toLowerCase().includes(q)))}function paginate(total){const pages=Math.ceil(total/perPage);pagination.innerHTML="";if(pages<=1)return;const add=(label,p,disabled,active)=>{const b=document.createElement("button");b.className="news-page-btn"+(active?" active":"");b.textContent=label;b.disabled=disabled;if(!disabled)b.onclick=()=>{page=p;render();window.scrollTo({top:0,behavior:"smooth"})};pagination.appendChild(b)};add("←",page-1,page===1,false);for(let i=1;i<=pages;i++)add(String(i),i,false,i===page);add("→",page+1,page===pages,false)}function render(){const f=filtered(),total=f.length,pages=Math.ceil(total/perPage);if(pages&&page>pages)page=pages;const start=(page-1)*perPage,visible=f.slice(start,start+perPage);if(!total){grid.innerHTML='<div class="news-empty">No news found for this selection.</div>';status.textContent="";pagination.innerHTML="";return}grid.innerHTML=visible.map(card).join("");status.textContent=`Showing ${start+1}–${start+visible.length} of ${total} news`;paginate(total)}async function load(){try{const r=await fetch(NEWS_PAGE_API+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("API "+r.status);const d=await r.json();if(!d||d.success!==true||!Array.isArray(d.news))throw Error("Invalid API response");items=d.news.slice();render()}catch(e){console.error(e);grid.innerHTML='<div class="news-empty">Latest news could not be loaded. Please refresh the page.</div>'}}filters.forEach(b=>b.onclick=()=>{filters.forEach(x=>x.classList.remove("active"));b.classList.add("active");category=b.dataset.category||"ALL";page=1;render()});search.oninput=()=>{page=1;render()};window.addEventListener("load",()=>setTimeout(load,300));</script>
</body>
</html>
